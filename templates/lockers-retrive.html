<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ロッカー - 取り出し</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>← 取り出し</h1>
        <div id="stats">現在の空き：<span id="vacant-count">0</span> / 12</div>
    </header>

    {# classの条件分岐は {{ }} の中で完結させると安全です #}
    <main class="app-container {{ 'is-done' if is_done else '' }}">
        <div class="locker-grid">
            {% for id, detail in info.items() %}
                {# 状態判定 #}
                {% set status = get_status(id) %}
                
                <div class="locker-unit id-{{ id }} {{ status }} {{ 'processing' if target_id == id else '' }}"
                     style="grid-column: {{ detail.col }}; grid-row: {{ detail.row }};"
                     {% if status == 'occupied' %} onclick="selectLocker({{ id }})" {% endif %}>
                    {{ id }}
                </div>
            {% endfor %}
        </div>

        <section id="form-area">
            {% if not is_done %}
                <form action="/lockers/retrieve" method="POST" id="retrieve-form">
                    <input type="hidden" name="locker_id" id="selected_id">
                    <label>暗証番号</label>
                    <input type="password" name="passcode" pattern="\d{4}" maxlength="4" required>
                    <button type="submit">取り出し開始</button>
                </form>
            {% else %}
                <div id="done-message">
                    <label>暗証番号</label>
                    <input type="password" value="{{ passed_code }}" readonly>
                    <p style="color:orange;">取り出し処理中･･･</p>
                    <button onclick="location.href='/'">トップへ</button>
                </div>
            {% endif %}
        </section>
    </main>

    <script>
        function selectLocker(id) {
            document.querySelectorAll('.locker-unit').forEach(el => el.classList.remove('selected'));
            document.querySelector('.id-' + id).classList.add('selected');
            document.getElementById('selected_id').value = id;
        }
        window.onload = function() {
            document.getElementById('vacant-count').innerText = document.querySelectorAll('.vacant').length;
        };
    </script>
</body>
</html>
