<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ロッカー - 取り出し</title>
    <style>
        .locker-grid { display: grid; grid-template-columns: repeat(5, 1fr) 20px 1fr; grid-template-rows: repeat(2, 80px); gap: 10px; }
        .locker-unit { border: 2px solid #333; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .occupied { background-color: #ADD8E6; cursor: pointer; } /* 使用中＝青 */
        .vacant { background-color: #D3D3D3; cursor: not-allowed; opacity: 0.5; } /* 空き＝灰 */
        .selected { border: 5px solid black !important; }
    </style>
</head>
<body>
    <h1>← 取り出し</h1>
    <div class="locker-grid">
        {% for id, det in info.items() %}
            {% set s = get_status(id) %}
            <div class="locker-unit id-{{id}} {{s}}" style="grid-column:{{det.col}}; grid-row:{{det.row}};"
                 {% if s == 'occupied' %} onclick="selectLocker({{id}})" {% endif %}>{{id}}</div>
        {% endfor %}
    </div>
    {% if not target_id %}
    <form action="/lockers/retrieve" method="POST" onsubmit="return !!document.getElementById('l_id').value">
        <input type="hidden" name="locker_id" id="l_id">
        <p>暗証番号入力: <input type="password" name="passcode" pattern="\d{4}" required></p>
        <button type="submit">取り出し開始</button>
    </form>
    {% else %}
    <div style="background:#fff3e0; padding:10px; margin-top:10px;">
        <p>取り出し完了: {{target_id}}番</p>
        <p>入力された番号: {{passed_code}}</p>
        <button onclick="location.href='/'">トップへ戻る</button>
    </div>
    {% endif %}
    <script>
        function selectLocker(id) {
            document.querySelectorAll('.locker-unit').forEach(e => e.classList.remove('selected'));
            document.querySelector('.id-'+id).classList.add('selected');
            document.getElementById('l_id').value = id;
        }
    </script>
</body>
</html>
