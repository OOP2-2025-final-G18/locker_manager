<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>預け入れ</title>
    <link rel="stylesheet" href="/static/lockers-deposit.css">
</head>
<body>

<!-- ======================
     /lockers/deposit
====================== -->
<div class="lockers-deposit">
    <div class="header">
        ← 預け入れ
    </div>

    <table class="lockers">
        <tr>
            <td>1</td>
            <td data-target>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
            <td rowspan="2">11</td>
            <td rowspan="2">12</td>
        </tr>
        <tr>
            <td>6</td>
            <td>7</td>
            <td>8</td>
            <td data-target>9</td>
            <td>10</td>
        </tr>
    </table>

    <div class="pin-area">
        <label>
            暗証番号
            <input
                type="text"
                inputmode="numeric"
                pattern="\d{4}"
                maxlength="4"
                placeholder="4桁の数字"
            >
        </label>

        <button class="deposit-btn">
            預け入れ開始
        </button>
    </div>

    <div class="message info">
        暗証番号を入力してください。
    </div>
</div>

<!-- ======================
     /lockers/deposit/done
====================== -->
<div class="lockers-deposit done">
    <div class="header">
        ← 預け入れ
    </div>

    <table class="lockers">
        <tr>
            <td>1</td>
            <td data-target>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
            <td rowspan="2">11</td>
            <td rowspan="2">12</td>
        </tr>
        <tr>
            <td>6</td>
            <td>7</td>
            <td>8</td>
            <td data-target>9</td>
            <td>10</td>
        </tr>
    </table>

    <div class="pin-area">
        <label>
            暗証番号
            <input
                type="text"
                inputmode="numeric"
                pattern="\d{4}"
                maxlength="4"
                placeholder="4桁の数字"
            >
        </label>

        <button class="deposit-btn disabled">
            預け入れ中…
        </button>
    </div>

    <div class="message success">
        預けました。扉が閉まるまでお待ちください。
    </div>
</div>

</body>
</html>
