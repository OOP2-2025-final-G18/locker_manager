<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>預け入れ</title>
    <link rel="stylesheet" href="/static/lockers-deposit.css">
</head>
<body>

<!-- ======================
     1枚目：/lockers/deposit
====================== -->
<div class="lockers-deposit" id="deposit-page">
    <div class="header">← 預け入れ</div>

    <table class="lockers">
        <tr>
            <td>1</td>
            <td data-target>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
            <td rowspan="2">11</td>
            <td rowspan="2">12</td>
        </tr>
        <tr>
            <td>6</td>
            <td>7</td>
            <td>8</td>
            <td data-target>9</td>
            <td>10</td>
        </tr>
    </table>

    <div class="pin-area">
        <label>
            暗証番号
            <input
                id="pin-input"
                type="text"
                inputmode="numeric"
                pattern="\d{4}"
                maxlength="4"
                placeholder="4桁の数字"
            >
        </label>

        <button class="deposit-btn" id="deposit-btn">
            預け入れ開始
        </button>
    </div>

    <div class="message info" id="error-message" style="display:none;">
        暗証番号は4桁の数字で入力してください。
    </div>
</div>

<!-- ======================
     2枚目：/lockers/deposit/done
====================== -->
<div class="lockers-deposit done" id="deposit-done-page" style="display:none;">
    <div class="header">← 預け入れ</div>

    <table class="lockers">
        <tr>
            <td>1</td>
            <td data-target>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
            <td rowspan="2">11</td>
            <td rowspan="2">12</td>
        </tr>
        <tr>
            <td>6</td>
            <td>7</td>
            <td>8</td>
            <td data-target>9</td>
            <td>10</td>
        </tr>
    </table>

    <div class="pin-area">
        <label>
            暗証番号
            <input type="text" disabled>
        </label>

        <button class="deposit-btn disabled">
            預け入れ中…
        </button>
    </div>

    <div class="message success">
        預けました。扉が閉まるまでお待ちください。
    </div>
</div>

<!-- ======================
     JavaScript
====================== -->
<script>
document.getElementById("deposit-btn").addEventListener("click", () => {
    const pin = document.getElementById("pin-input").value;
    const error = document.getElementById("error-message");

    if (!/^\d{4}$/.test(pin)) {
        error.style.display = "block";
        return;
    }

    error.style.display = "none";

    // 画面切り替え
    document.getElementById("deposit-page").style.display = "none";
    document.getElementById("deposit-done-page").style.display = "block";
});
</script>

</body>
</html>
